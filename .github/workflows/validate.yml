name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'release-please--**'
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, heytag-ci]
    steps:
      - uses: actions/checkout@v7

      - name: JSON syntax
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            node:22-alpine \
            node -e "
              const files = [
                'default.json',
                'package.json',
                '.github/release-please-config.json',
                '.github/.release-please-manifest.json',
              ];
              for (const f of files) {
                try {
                  JSON.parse(require('fs').readFileSync(f, 'utf8'));
                  console.log('ok', f);
                } catch (e) {
                  console.error('FAIL', f + ':', e.message);
                  process.exit(1);
                }
              }
            "

      - name: Version consistency
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            node:22-alpine \
            node -e "
              const pkg = require('./package.json').version;
              const manifest = require('./.github/.release-please-manifest.json')['.'];
              if (pkg !== manifest) {
                console.error('version mismatch: package.json=' + pkg + ' manifest=' + manifest);
                process.exit(1);
              }
              console.log('ok', pkg);
            "

      - name: Renovate config
        run: |
          docker run --rm \
            -v "$PWD/default.json:/default.json:ro" \
            node:22-alpine \
            sh -c "npx --yes --package renovate renovate-config-validator /default.json"
