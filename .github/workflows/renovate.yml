name: Renovate

on:
  schedule:
    - cron: '0 5 * * 1'  # Every Monday at 5am UTC
  workflow_dispatch:      # Allow manual trigger from GitHub UI
  issues:
    types: [edited]       # Triggered when Dependency Dashboard checkboxes are clicked

concurrency:
  group: renovate
  cancel-in-progress: false  # Never cancel a running Renovate job

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        with:
          token: ${{ steps.generate-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
