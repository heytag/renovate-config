name: Semantic PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    runs-on: [self-hosted, heytag-ci]
    steps:
      - # renovate: datasource=github-releases depName=amannn/action-semantic-pull-request
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
